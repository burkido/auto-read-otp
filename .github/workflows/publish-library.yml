name: Publish Library

on:
  release:
    types: [ published, prereleased ]

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Build & run checks
        run: ./gradlew assemble check

  publish:
    name: Verify JitPack publication
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Extract version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      # JitPack builds the tag on first request by running publishToMavenLocal
      # with VERSION set to the tag name. Run the exact same command here so a
      # broken publication fails this workflow instead of the JitPack build.
      - name: Verify publications (simulates JitPack build)
        run: ./gradlew publishToMavenLocal
        env:
          VERSION: ${{ env.RELEASE_VERSION }}

      - name: List published artifacts
        run: find ~/.m2/repository/com/github/burkido -type f -name "*.pom" -o -type f -name "*.aar" -o -type f -name "*.jar" | sort

      # JitPack automatically picks up the tag created by the GitHub Release
      # and serves it at: https://jitpack.io/#burkido/auto-read-otp/<tag>
      - name: Confirm release tag
        run: echo "✅ Tag ${{ env.RELEASE_VERSION }} verified — JitPack will build it on first request."