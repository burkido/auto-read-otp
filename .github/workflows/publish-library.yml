name: Publish Library

on:
  release:
    types: [ published, prereleased ]

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Build & run checks
        run: ./gradlew assemble check

  publish:
    name: Publish to JitPack
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Extract version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build release artifacts
        run: ./gradlew assemble
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}

      # JitPack automatically picks up the tag created by the GitHub Release.
      # No extra publish step needed — JitPack will build on the first request
      # for this version at: https://jitpack.io/#<owner>/<repo>/<tag>
      - name: Confirm release tag
        run: echo "✅ Tag ${{ env.RELEASE_VERSION }} is live — JitPack will build on first request."