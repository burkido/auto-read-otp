version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      androidx:
        patterns: [ "androidx.*" ]
      kotlin:
        patterns: [ "org.jetbrains.kotlin*", "org.jetbrains.kotlinx*" ]
      play-services:
        patterns: [ "com.google.android.gms*" ]
      tooling:
        patterns: [ "com.android.tools*", "dev.detekt*", "io.nlopez*", "org.jetbrains.dokka*", "com.vanniktech*", "io.github.takahirom*" ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: [ "*" ]
